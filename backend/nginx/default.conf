# WebSocket upgrade: "Connection: upgrade" only when the client asks for it
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api_upstream {
  server api:5000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 6m;   # images are capped at 5 MB by the API

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # REST API
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.IO (WebSocket plus long-polling fallback)
  location /socket.io/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;  # idle sockets stay open
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Everything else: the React app will be served here later
  location / {
    return 404;
  }
}

